buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.21'
        classpath 'org.jlleitschuh.gradle:ktlint-gradle:14.2.0'
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'org.jlleitschuh.gradle.ktlint'

android {
    namespace 'com.vibemoments.camera'
    compileSdk 36

    defaultConfig {
        minSdk 23
        targetSdk 36

        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    if (findProject(':capacitor-android') != null) {
        implementation project(':capacitor-android')
    } else {
        implementation 'com.capacitorjs:capacitor-android:8.5.0'
    }

    implementation 'androidx.appcompat:appcompat:1.7.1'

    def cameraxVersion = '1.5.2'

    implementation "androidx.camera:camera-core:$cameraxVersion"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
    implementation "androidx.camera:camera-view:$cameraxVersion"

    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
}